
<!DOCTYPE html>
<html>
<head>
  <meta charset='UTF-8'>
  <title>多腿期權模擬器</title>
  <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
  <style>
    body {
      background-color: #000;
      color: #00FF66;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    label, input, select, button {
      display: block;
      margin: 8px 0;
      width: 100%;
      color: #00FF66;
      background-color: #111;
      border: 1px solid #00FF66;
      padding: 8px;
    }
    canvas {
      margin-top: 20px;
    }
    .result {
      margin-top: 10px;
      font-weight: bold;
      white-space: pre-line;
      color: #00FF66;
    }
  </style>
</head>
<body>
  <h2>📊 多腿期權模擬器</h2>
  <div id="legs-container">
    <div class="leg">
      <label>期權類型:
        <select class='type'>
          <option value='call'>Call</option>
          <option value='put'>Put</option>
        </select>
      </label>
      <label>買/賣:
        <select class='side'>
          <option value='buy'>買進</option>
          <option value='sell'>賣出</option>
        </select>
      </label>
      <label>履約價 (K): <input type='number' class='strike' value='100'></label>
      <label>數量: <input type='number' class='qty' value='1'></label>
    </div>
  </div>
  <button onclick='addLeg()'>➕ 新增腿</button>
  <hr>
  <label>標的資產價格 (S): <input type='number' id='spot' value='100'></label>
  <label>無風險利率 (r): <input type='number' id='rate' value='0.05'></label>
  <label>波動率 (σ): <input type='number' id='vol' value='0.2'></label>
  <label>剩餘時間 (T, 年): <input type='number' id='time' value='0.5'></label>
  <button onclick='calculate()'>📊 計算與繪圖</button>
  <canvas id='pnlChart' height='300'></canvas>
  <script>
    function cdf(x) {
      return (1 + erf(x / Math.sqrt(2))) / 2;
    }
    function pdf(x) {
      return Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
    }
    function erf(x) {
      const sign = (x >= 0) ? 1 : -1;
      x = Math.abs(x);
      const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741;
      const a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
      const t = 1.0 / (1.0 + p * x);
      const y = 1.0 - (((((a5*t + a4)*t + a3)*t + a2)*t + a1)*t * Math.exp(-x*x));
      return sign * y;
    }
    function blackScholesPrice(type, S, K, r, σ, T) {
      const d1 = (Math.log(S / K) + (r + 0.5 * σ * σ) * T) / (σ * Math.sqrt(T));
      const d2 = d1 - σ * Math.sqrt(T);
      return type === 'call'
        ? S * cdf(d1) - K * Math.exp(-r * T) * cdf(d2)
        : K * Math.exp(-r * T) * cdf(-d2) - S * cdf(-d1);
    }
    function addLeg() {
      const container = document.getElementById('legs-container');
      const clone = container.firstElementChild.cloneNode(true);
      container.appendChild(clone);
    }
    let chart;
    function calculate() {
      const S = parseFloat(document.getElementById('spot').value);
      const r = parseFloat(document.getElementById('rate').value);
      const σ = parseFloat(document.getElementById('vol').value);
      const T = parseFloat(document.getElementById('time').value);
      const legs = Array.from(document.querySelectorAll('.leg')).map(el => ({
        type: el.querySelector('.type').value,
        side: el.querySelector('.side').value,
        K: parseFloat(el.querySelector('.strike').value),
        qty: parseFloat(el.querySelector('.qty').value)
      }));
      let xValues = [], totalPnL = [];
      for (let s = S * 0.5; s <= S * 1.5; s += 1) {
        let total = 0;
        for (let leg of legs) {
          const price = blackScholesPrice(leg.type, s, leg.K, r, σ, T);
          const payoff = leg.type === 'call' ? Math.max(0, s - leg.K) : Math.max(0, leg.K - s);
          const cost = price * 100;
          const pnl = (leg.side === 'buy' ? 1 : -1) * (payoff * 100 - cost) * leg.qty;
          total += pnl;
        }
        xValues.push(s.toFixed(2));
        totalPnL.push(total.toFixed(2));
      }
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById('pnlChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: xValues,
          datasets: [{
            label: '總PnL',
            data: totalPnL,
            borderColor: '#00FF66',
            borderWidth: 2
          }]
        },
        options: {
          scales: {
            x: { title: { display: true, text: '標的價格' }, ticks: { color: '#00FF66' } },
            y: { title: { display: true, text: 'PnL ($)' }, ticks: { color: '#00FF66' } }
          },
          plugins: {
            legend: { labels: { color: '#00FF66' }}
          }
        }
      });
    }
  </script>
</body>
</html>
