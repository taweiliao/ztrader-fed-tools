
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GPT 會議摘要模塊</title>
  <style>
    body {
      background-color: #000;
      color: #00FF66;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background-color: #111;
      color: #00FF66;
      border: 1px solid #00FF66;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      background-color: #111;
      color: #00FF66;
      border: 1px solid #00FF66;
      padding: 10px;
      width: 100%;
      margin-top: 10px;
    }
    pre {
      background-color: #111;
      padding: 10px;
      margin-top: 15px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h2>🧠 GPT 會議摘要模塊</h2>
  <p>輸入 FOMC 官方聲明或會議新聞，使用 GPT 自動生成摘要：</p>
  <textarea id="inputText" placeholder="請貼上美聯儲聲明或新聞內容..."></textarea>
  <button onclick="summarize()">✨ 使用 GPT 摘要</button>
  <pre id="outputText">摘要結果會顯示在這裡...</pre>

  <script>
    async function summarize() {
      const text = document.getElementById('inputText').value;
      const output = document.getElementById('outputText');
      output.textContent = "⏳ 正在生成摘要...";
      try {
        const response = await fetch("http://localhost:11434/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "tinyllama",
            prompt: "請總結以下 FOMC 聲明的主要內容與政策信號：\n" + text,
            stream: false
          })
        });
        const data = await response.json();
        output.textContent = data.response || "⚠️ 無法解析 TinyLlama 回應";
      } catch (err) {
        output.textContent = "❌ 錯誤：" + err.message;
      }
    }
  </script>
</body>
</html>
